name: validate-skin
on:
  push:
    paths: ["skins/**", "scripts/**", ".github/workflows/**"]
  pull_request:
    paths: ["skins/**", "scripts/**"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsh-skins tooling
        uses: actions/checkout@v4
        with:
          repository: zhu1090093659/dsh-skins
          ref: main
          path: dsh-skins
      - name: Checkout skin
        uses: actions/checkout@v4
        with:
          path: skin
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.24.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: pnpm
          cache-dependency-path: dsh-skins/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          cd dsh-skins
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build skin-center lib
        run: |
          cd dsh-skins
          pnpm build
      - name: Validate skin against the v2 contract
        run: |
          cd dsh-skins
          node scripts/dsh-skin.cjs validate ../skin/skins/swiss-typographic

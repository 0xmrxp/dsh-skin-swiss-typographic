name: validate-skin
on:
  push:
    paths: ["skins/**", "scripts/**", ".github/workflows/**"]
  pull_request:
    paths: ["skins/**", "scripts/**"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zhu1090093659/dsh-skins
          ref: main
          path: dsh-skins
      - uses: actions/checkout@v4
        with:
          path: skin
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dsh-skins tooling dependencies
        run: |
          cd dsh-skins
          pnpm install --frozen-lockfile
          pnpm --filter @linxin666/dsh-client-ui-skin-center build
      - name: Validate skin against the v2 contract
        run: |
          cd dsh-skins
          node scripts/dsh-skin.cjs validate ../skin/skins/swiss-typographic
